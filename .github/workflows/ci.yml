name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # TODO(next-bounty): non-blocking. Every remaining advisory is transitive
      # through @creit.tech/stellar-wallets-kit (which pulls the Solana wallet
      # adapters) and @stellar/stellar-sdk, and clearing them needs major
      # version bumps of both. Triage them deliberately, then drop this flag.
      - name: Audit dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Coverage report
        run: npm run test -- --coverage
        continue-on-error: true
      - run: npm run build
        env:
          ENFORCE_BUDGET: "true"

  # TODO(next-bounty): non-blocking until someone verifies it end to end. This
  # job never once completed during the first bounty programme -- `npm ci` failed
  # on every run before Playwright was ever invoked -- so the specs in e2e/ have
  # no known-good baseline. Green it, then remove continue-on-error.
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
